# Local dev / self-host compose for JKL aiAgent Mission Control.
# One Node service (React app + REST + WebSocket + JAY JAY orchestrator) plus a
# Postgres for persistent state. On Coolify, point MERIDIAN_BASE_URL at your
# Meridian service (e.g. http://meridian:8080) and use a managed/persistent DB.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mission
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mission}
      POSTGRES_DB: missioncontrol
    volumes:
      - mc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission -d missioncontrol"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://mission:${POSTGRES_PASSWORD:-mission}@db:5432/missioncontrol
      # Meridian — the Anthropic-compatible proxy in front of your Claude session.
      MERIDIAN_BASE_URL: ${MERIDIAN_BASE_URL:-http://meridian:8080}
      MERIDIAN_API_KEY: ${MERIDIAN_API_KEY:-meridian}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-claude-haiku-4-5-20251001}
      # Auth — CHANGE THESE before exposing the app.
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-32-char-string}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mc-db:
